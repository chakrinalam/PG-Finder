<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thilavaram PG Finder</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Background */
        body {
            height: 100vh;
            background: url("SRM.jpg") no-repeat center/cover;
            position: relative;
            color: white;
        }

        /* Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Top Search */
        .top-search {
            position: absolute;
            top: 25px;
            right: 40px;

            display: flex;
            align-items: center;
            gap: 10px;

            background: rgba(255, 255, 255, 0.85);
            padding: 8px 15px;
            border-radius: 30px;
        }

        .top-search i {
            color: #444;
        }

        .top-search input {
            border: none;
            outline: none;
            background: transparent;
            width: 250px;
        }

        /* Center */
        .center {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Heading */
        h1 {
            font-family: 'Zen Dots', sans-serif;
            font-size: 38px;
            margin-bottom: 25px;
        }

        /* Normal Box */
        .card {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            width: 420px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            /* Optional shadow */
        }


        /* Dropdown */
        select {
            width: 750px;
            height: 60px;

            border: none;
            border-radius: 6px;

            text-align: center;
            text-align-last: center;

            font-size: 15px;
            outline: none;

            background: rgba(255, 255, 255, 0.623);
            color: #000000;
            cursor: pointer;

            margin-bottom: 35px;
            /* Space below */
        }

        /* Gender Buttons */
        .gender {
            display: flex;
            gap: 150px;
            margin-bottom: 20px;
            margin-top: 35px;
        }

        .gender button {
            width: 90px;
            height: 35px;

            border: none;
            border-radius: 5px;

            background: rgba(255, 255, 255, 0.623);
            color: #333;

            cursor: pointer;
            transition: 0.1s;

            margin-bottom: 20px;
        }

        /* Hover effect */
        .gender button:hover {
            background: #f1f1f1;
        }

        .gender button.active {
            background: #28a745;
            color: white;
        }

        .Explore-btn {
            width: 321px;
            height: 40px;

            border: none;
            border-radius: 6px;

            background: rgba(255, 255, 255, 0.623);
            color: #333;

            font-size: 15px;
            cursor: pointer;

            transition: all 0.15s ease;

            margin-top: 20px;
        }

        /* Hover effect */
        .Explore-btn:hover {
            background: #f1f1f1;
        }

        /* Active (When Clicked) */
        .Explore-btn:active {
            background: #380cc9;
            color: white;

            transform: scale(0.96);
        }

        /* After Click (JS will add this) */
        .Explore-btn.clicked {
            background: #380cc9;
            color: white;
        }
    </style>
</head>


<body>

    <!-- Top Search -->
    <div class="top-search">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search for stay , things to do more.....">
    </div>


    <!-- Center -->
    <div class="center">

        <h1>FIND PG'S NEAR BY SRM</h1>

        <!-- Location -->
        <select id="location">
            <option value="thilavaram">Thilavaram</option>
            <option value="potheri">Potheri</option>
            <option value="Guduvancheri">Guduvancheri</option>
            <option value="MM NAGAR">MM NAGAR</option>
        </select>


        <!-- Gender -->
        <div class="gender">

            <button id="boysBtn" onclick="selectGender('boys')">
                Boys
            </button>

            <button id="girlsBtn" onclick="selectGender('girls')">
                Girls
            </button>

        </div>

        <!-- Explore -->
        <button class="Explore-btn" onclick="searchPG()">
            Explore
        </button>

    </div>


    <script>

        let selectedGender = "";

        /* Gender Selection */
        function selectGender(gender) {

            const boys = document.getElementById("boysBtn");
            const girls = document.getElementById("girlsBtn");

            boys.classList.remove("active");
            girls.classList.remove("active");

            if (gender === "boys") {
                boys.classList.add("active");
            }
            else {
                girls.classList.add("active");
            }

            selectedGender = gender;
        }


        /* Search Action */
        function searchPG() {

            const btn = document.querySelector(".Explore-btn");
            const location = document.getElementById("location").value;

            if (selectedGender === "") {
                alert("Please select Boys or Girls");
                return;
            }

            /* Add clicked effect */
            btn.classList.add("clicked");

            setTimeout(() => {
                btn.classList.remove("clicked");
            }, 800);

            alert(
                "Searching PGs in " +
                location +
                " for " +
                selectedGender
            );
        }


    </script>

</body>

</html>
