<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find PG Near SRM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Google Font (same modern style) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

    <option value="thailavaram">Thailavaram</option>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* ===== BACKGROUND IMAGE ===== */
        body {
            height: 100vh;
            background: url("SRM.jpg") no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Dark overlay like screenshot */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* ===== TOP SEARCH BAR ===== */
        .top-search {
            position: absolute;
            top: 25px;
            right: 40px;

            display: flex;
            align-items: center;
            gap: 10px;

            background: rgba(255, 255, 255, 0.85);
            padding: 8px 15px;
            border-radius: 30px;
        }


        .top-search input {
            border: none;
            outline: none;
            background: transparent;
            width: 260px;
            font-size: 14px;
        }

        .top-search i {
            color: #555;
            font-size: 18px;
        }


        /* ===== CENTER CONTENT ===== */
        .center-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: 'Zen Dots', sans-serif;
        }


        /* Dropdown */
        select {
            width: 750px;
            /* Width */
            height: 70px;
            /* Height */

            padding: 14px;
            border: none;
            border-radius: 8px;

            font-size: 16px;
            outline: none;

            background: rgba(255, 255, 255, 0.623);
            color: #000000;
            cursor: pointer;

            text-align: center;
            text-align-last: center;
        }

        /* Gender Buttons */
        .gender {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px 0;
        }

        .gender button {
            width: 90px;
            height: 35px;

            border: none;
            border-radius: 5px;

            background: rgba(255, 255, 255, 0.6);
            color: #333;

            cursor: pointer;
            transition: 0.2s;
        }

        .gender button.active {
            background: #158cfc85;
            color: white;
        }

        /* Search Button */
        .search-btn {
            width: 321px;
            height: 40px;

            border: none;
            border-radius: 6px;

            background: white;

            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Top Search -->
    <div class="top-search">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search for stay, things to do more......">
    </div>


    <!-- Center Content -->
    <div class="center-container">

        <h1>FIND PG'S NEAR BY SRM</h1>

        <div class="dropdown-box">
            <select id="location">
                <option value="">Pick the Location for the Stay....</option>
                <option value="potheri">Potheri</option>
                <option value="thailavaram">Thailavaram</option>
            </select>
        </div>

        <!-- Gender & Search Section -->
        <div id="detailsSection" style="display:none;">

            <!-- Gender -->
            <div class="gender">

                <button id="boysBtn" onclick="selectGender('boys')">
                    Boys
                </button>

                <button id="girlsBtn" onclick="selectGender('girls')">
                    Girls
                </button>

            </div>

            <!-- Search -->
            <button class="search-btn" onclick="searchPG()">
                Search
            </button>

        </div>

    </div>

    <script>

        let selectedGender = "";

        const locationSelect = document.getElementById("location");
        const details = document.getElementById("detailsSection");

        locationSelect.addEventListener("change", function () {

            if (this.value !== "") {
                details.style.display = "block"; // Show section
            } else {
                details.style.display = "none";  // Hide again
            }

        });


        function selectGender(gender) {

            const boys = document.getElementById("boysBtn");
            const girls = document.getElementById("girlsBtn");

            boys.classList.remove("active");
            girls.classList.remove("active");

            if (gender === "boys") {
                boys.classList.add("active");
            } else {
                girls.classList.add("active");
            }

            selectedGender = gender;
        }


        function searchPG() {

            const location = locationSelect.value;

            if (location === "") {
                alert("Select a location first");
                return;
            }

            if (selectedGender === "") {
                alert("Select Boys or Girls");
                return;
            }

            alert(
                "Searching PGs in " + location +
                " for " + selectedGender
            );

            // Later: load PG results here
        }


    </script>

</body>

</html>
